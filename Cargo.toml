[package]
name = "corral"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Installa llama.cpp, scarica modelli GGUF da Hugging Face e avvia llama-server sotto una dashboard live"

[dependencies]
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
